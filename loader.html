<script>
(function(){
var BASE='https://cdn.jsdelivr.net/gh/hey-sutton/marketing-site-graphics@v1.0.0/';
function go(){
var cards=document.querySelectorAll('.capabilities_card-visual');
if(!cards.length)return;
var tag=document.querySelector('[data-sx-industry]');
var key=(tag&&tag.getAttribute('data-sx-industry'))||'';
if(!key){var p=location.pathname.match(/\/industries\/([^\/?#]+)/);key=p?p[1]:'';}
key=key.toLowerCase().replace(/[^a-z0-9-]/g,'');
if(!key)return;
fetch(BASE+'manifest.json').then(function(r){return r.ok?r.json():null;}).then(function(m){
var list=m&&m.graphics&&m.graphics[key];
if(!list||!list.length)return;
var st=document.createElement('style');
st.textContent='.capabilities_card-visual[data-sxg]{flex:none;aspect-ratio:604/540}.capabilities_card-visual[data-sxg] .capabilities_visual-bg{position:absolute;top:0;left:0;width:100%;height:100%;max-height:none}@media (min-width:1440px){.capabilities_card-visual[data-sxg]{aspect-ratio:604/523}}';
document.head.appendChild(st);
list.forEach(function(n){
var c=cards[n-1];
if(!c)return;
c.setAttribute('data-sxg','1');
if(!c.getAttribute('data-sx-industry'))c.setAttribute('data-sx-industry',key);
var load=function(){
var s=document.createElement('script');
s.src=BASE+'graphics/'+key+'/card-'+n+'.js';
s.async=true;
s.sxCard=c;
document.head.appendChild(s);
};
if('IntersectionObserver' in window){
var io=new IntersectionObserver(function(es){
if(es.some(function(e){return e.isIntersecting;})){io.disconnect();load();}
},{rootMargin:'800px 0px'});
io.observe(c);
}else{load();}
});
}).catch(function(){});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
