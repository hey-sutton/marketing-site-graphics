<script>
(function(){
var BASE='https://cdn.jsdelivr.net/gh/hey-sutton/marketing-site-graphics@v1.11.0/';
/* One entry per post: which graphic folder to load, an optional card shape (ar), an optional emphasis (lot-trace: supplier, genealogy or batch; barcode-scan: warehouse or manufacturing), and all:true when a post carries duplicate HowdyGo embeds that must all be hidden. */
var MAP={
'traceability-in-food-industry':{key:'blog-food-traceability',ar:'604/660'},
'food-recall-management':{key:'blog-food-traceability',ar:'604/660'},
'best-food-traceability-software':{key:'blog-food-traceability',ar:'604/660'},
'food-supply-chain':{key:'lot-trace',em:'supplier'},
'food-processing':{key:'lot-trace',em:'genealogy'},
'batch-manufacturing':{key:'lot-trace',em:'batch'},
'shelf-life-management':{key:'lot-expiry'},
'fefo':{key:'lot-expiry'},
'best-warehouse-management-software':{key:'warehouse-ops',ar:'604/650'},
'warehouse-management-process':{key:'warehouse-ops',ar:'604/650'},
'pick-pack-ship':{key:'warehouse-ops',ar:'604/650'},
'warehouse-barcode-system':{key:'barcode-scan',ar:'604/650',em:'warehouse',all:true},
'manufacturing-barcode-system':{key:'barcode-scan',ar:'604/650',em:'manufacturing'}
};
/* Posts with no graphic yet whose HowdyGo embed is broken: take the embed off the page. The article text is not touched. */
var REMOVE=['3pl-warehouse-management-system','food-processing-and-manufacturing','standardized-recipe','quickbooks-online-bill-of-materials','contract-manufacturing','multi-level-boms','food-production-line'];
/* Banner copy per graphic: the screen name for the headline and the noun for the footer line. */
var FRAME={'blog-food-traceability':['food traceability','lots'],'lot-trace':['lot trace','lots'],'lot-expiry':['lot expiry','lots'],'warehouse-ops':['warehouse operations','orders'],'barcode-scan':['barcode scanning','inventory']};
var DEMO_URL='https://heysutton.com/book-a-demo';
var SALES_URL='';/* Talk to sales: add the URL here when there is one, and the button appears. */
var STUDIO_URL='https://heysutton.com/studio';
var DBG=/[?&]sxgdebug/.test(location.search);
function log(t){if(DBG&&window.console)console.log('[sxg-blog] '+t);}
var m=location.pathname.match(/\/blog\/([^\/?#]+)/);
var slug=m?m[1].toLowerCase():'';
if(REMOVE.indexOf(slug)>=0){
var drop=function(){[].forEach.call(document.querySelectorAll('.w-richtext #howdygo-embed'),function(e){var t=e.closest('.w-embed,[data-rt-embed-type]')||e;if(t.parentNode){log('removing howdygo embed');t.parentNode.removeChild(t);}});};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',drop);else drop();
return;}
var cfg=MAP[slug];
if(!cfg)return;
var KEY=cfg.key;
function find(){
/* The graphic replaces the HowdyGo embed that sits under the "with Sutton" heading. */
var embs=[].slice.call(document.querySelectorAll('.w-richtext #howdygo-embed'));
if(!embs.length){var one=document.querySelector('.w-richtext [id^="howdygo"]');if(one)embs=[one];}
if(embs.length){var hide=[];embs.forEach(function(e){var t=e.closest('.w-embed,[data-rt-embed-type]')||e;if(hide.indexOf(t)<0)hide.push(t);});if(!cfg.all)hide=hide.slice(0,1);log('replacing '+hide.length+' howdygo embed(s)');return{ref:hide[0],hide:hide};}
var hs=document.querySelectorAll('.w-richtext h2,.w-richtext h3');
for(var i=0;i<hs.length;i++){if(/with sutton\s*$|^\s*1\.\s*sutton/i.test(hs[i].textContent)){log('no howdygo embed, placing after heading');return{ref:hs[i].nextSibling,hide:[],parent:hs[i].parentNode};}}
return null;}
function css(){
if(document.getElementById('sxg-frame-css'))return;
var st=document.createElement('style');st.id='sxg-frame-css';
st.textContent='.sxg-frame{max-width:720px;margin:1.5rem auto;border:1px solid #e2e3e6;background:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#16171b;box-sizing:border-box;border-radius:0}'
+'.sxg-frame *{box-sizing:border-box}'
+'.sxg-h{min-height:104px;padding:16px 24px;border-bottom:1px solid #e2e3e6;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff}'
+'.sxg-hl{display:flex;flex-direction:column;gap:12px;min-width:0}'
+'.sxg-r1{display:flex;align-items:center;gap:12px;min-height:24px}'
+'.sxg-logo{display:block;width:86px;height:auto}'
+'.sxg-tag{font-size:11px;font-weight:500;letter-spacing:.16em;color:#ef7029;text-transform:uppercase;line-height:1}'
+'.sxg-hd{margin:0;font-size:20px;font-weight:500;line-height:1.25;color:#16171b}'
+'.sxg-live{flex:none;height:26px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;background:#16171b;color:#fff;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1}'
+'.sxg-live i{display:block;width:7px;height:7px;background:#1f8a5b}'
+'.sxg-stage{position:relative;width:100%;overflow:hidden}'
+'.sxg-f{min-height:100px;padding:16px 24px;background:#103d35;display:flex;align-items:center;justify-content:space-between;gap:16px}'
+'.sxg-ft{min-width:0}'
+'.sxg-ft b{display:block;margin:0;font-size:17px;font-weight:500;line-height:1.3;color:#fff}'
+'.sxg-ft span{display:block;margin-top:4px;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.8)}'
+'.sxg-ft a{display:inline-block;margin-top:6px;font-size:11.5px;color:rgba(255,255,255,.6);text-decoration:underline;text-underline-offset:2px}'
+'.sxg-ft a:hover{color:rgba(255,255,255,.9)}'
+'.sxg-btns{flex:none;display:flex;gap:10px}'
+'.sxg-btn{height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;font-size:13px;line-height:1;text-decoration:none;white-space:nowrap;border-radius:0}'
+'.sxg-btn:focus-visible,.sxg-ft a:focus-visible{outline:2px solid #fff;outline-offset:2px}'
+'.sxg-book{background:#ef7029;color:#16171b;font-weight:600}'
+'.sxg-book:hover{background:#f38848}'
+'.sxg-sales{border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:500}'
+'.sxg-sales:hover{border-color:rgba(255,255,255,.7)}'
+'@media (max-width:560px){.sxg-live{display:none}.sxg-h{padding:16px 20px}.sxg-f{flex-direction:column;align-items:stretch;padding:20px}.sxg-btns{flex-direction:column-reverse}.sxg-btn{width:100%}}';
document.head.appendChild(st);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
/* The Sutton frame: header band, the demo stage, footer band. Everything outside the stage is built here once, so no graphic file changes. */
function frame(cfg,stage){
var fc=FRAME[cfg.key]||['this screen','data'];
var wrap=el('div','sxg-frame');wrap.setAttribute('role','group');wrap.setAttribute('aria-label','Sutton demo: '+fc[0]);
var h=el('div','sxg-h');var hl=el('div','sxg-hl');var r1=el('div','sxg-r1');
var logo=document.createElement('img');logo.className='sxg-logo';logo.alt='Sutton';logo.width=86;logo.src=BASE+'assets/sutton-logo-color.svg';logo.onerror=function(){logo.style.display='none';log('logo failed to load');};
r1.appendChild(logo);r1.appendChild(el('span','sxg-tag','AI-native ERP'));
hl.appendChild(r1);hl.appendChild(el('p','sxg-hd','This is '+fc[0]+' in Sutton.'));
var live=el('span','sxg-live');live.appendChild(el('i'));live.appendChild(document.createTextNode('Live demo'));
h.appendChild(hl);h.appendChild(live);
var f=el('div','sxg-f');var ft=el('div','sxg-ft');
ft.appendChild(el('b',null,'Run it on your own '+fc[1]+'.'));ft.appendChild(el('span',null,'Inventory, production and shipping in one system.'));
var sl=el('a',null,'Customize it with Studio');sl.href=STUDIO_URL;ft.appendChild(sl);
var bt=el('div','sxg-btns');
if(SALES_URL){var sa=el('a','sxg-btn sxg-sales','Talk to sales');sa.href=SALES_URL;bt.appendChild(sa);}
var bk=el('a','sxg-btn sxg-book','Book a demo \u2192');bk.href=DEMO_URL;bt.appendChild(bk);
f.appendChild(ft);f.appendChild(bt);
wrap.appendChild(h);wrap.appendChild(stage);wrap.appendChild(f);
return wrap;}
function go(){
if(document.querySelector('[data-sxg-blog]'))return;
var f=find();
if(!f){log('no target found');return;}
css();
var box=document.createElement('div');
box.className='sxg-stage';
box.setAttribute('data-sxg-blog','1');
if(cfg.em)box.setAttribute('data-sx-emphasis',cfg.em);
box.style.aspectRatio=cfg.ar||'604/580';
var fr=frame(cfg,box);
f.hide.forEach(function(e){e.style.display='none';});
(f.parent||f.ref.parentNode).insertBefore(fr,f.ref);
log('mounted frame, stage '+box.offsetWidth+'x'+box.offsetHeight);
var s=document.createElement('script');
s.src=BASE+'graphics/'+KEY+'/card-1.js';
s.async=true;
s.sxCard=box;
s.onload=function(){var h=box.querySelector('[data-sxg-host]');if(h&&h.shadowRoot){var q=document.createElement('style');q.textContent='.studio{display:none!important}';h.shadowRoot.appendChild(q);}};
s.onerror=function(){log('graphic failed to load');fr.remove();f.hide.forEach(function(e){e.style.display='';});};
function start(){log('loading graphic');document.head.appendChild(s);}
if('IntersectionObserver' in window){
var io=new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting;})){io.disconnect();start();}},{rootMargin:'1200px 0px'});
io.observe(box);
}else start();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
