function takeOver(){var w=cardWin();if(w)w.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
function hide(){clearTimeout(tm);end.classList.remove('on','pin');waiting=false;}
function cardPhoto(){var w=cardWin(),si=w&&w.parentNode;if(si){var bg=getComputedStyle(si).backgroundImage;if(bg&&bg!=='none')eph.style.backgroundImage=bg;}}
function syncPhoto(){if(eph.getAttribute('data-bg'))return;eph.setAttribute('data-bg','1');cardPhoto();if(TOWERSRC){var im=new Image();im.onload=function(){eph.style.backgroundImage='url('+TOWERSRC+')';};im.src=TOWERSRC;}}
function showEnd(){syncPhoto();end.style.setProperty('--hold',HOLD+'ms');end.classList.remove('on','pin');void end.offsetWidth;end.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){if(pinned){waiting=true;end.classList.add('pin');takeOver();}else hide();},HOLD);}
stage.addEventListener('sxg:complete',function(e){if(shown>=MAXEND||!e.detail)return;shown++;e.detail.hold=HOLD;track('end_card',cfg.key,'end');showEnd();});
end.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')pinned=true;});
end.addEventListener('pointerleave',function(e){pinned=false;if(waiting)setTimeout(hide,900);});
end.addEventListener('focusin',function(){pinned=true;});
end.addEventListener('focusout',function(e){if(!end.contains(e.relatedTarget)){pinned=false;if(waiting)setTimeout(hide,900);}});
keep.addEventListener('click',function(){hide();takeOver();track('keep_exploring',cfg.key,'end');});
root.addEventListener('keydown',function(e){if(e.key==='Escape'&&end.classList.contains('on')){hide();takeOver();}});
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){wrap.classList.add('in');io.disconnect();}},{threshold:.12});io.observe(host);}else wrap.classList.add('in');
return host;}
function go(){
if(document.querySelector('[data-sxg-frame]'))return;
var f=find();
if(!f){log('no target found');return;}
var box=document.createElement('div');
box.setAttribute('data-sxg-blog','1');
if(cfg.em)box.setAttribute('data-sx-emphasis',cfg.em);
box.style.aspectRatio=cfg.ar||'604/580';
var fr=(cfg.v2?frame2:frame)(cfg,box);
f.hide.forEach(function(e){e.style.display='none';});
(f.parent||f.ref.parentNode).insertBefore(fr,f.ref);
log('mounted frame, stage '+box.offsetWidth+'x'+box.offsetHeight);
var s=document.createElement('script');
s.src=BASE+'graphics/'+KEY+'/card-1.js';
s.async=true;
s.sxCard=box;
s.onload=function(){var h=box.querySelector('[data-sxg-host]');if(h&&h.shadowRoot){var q=document.createElement('style');q.textContent=(cfg.v2?'.rp{display:none!important}':'.studio{display:none!important}')+'.fw-title,.ch{font-family:"Acid Grotesk",Inter,system-ui,sans-serif!important;font-weight:400!important;letter-spacing:0!important}.fw-title{font-size:15px!important}';h.shadowRoot.appendChild(q);}};
s.onerror=function(){log('graphic failed to load');fr.remove();f.hide.forEach(function(e){e.style.display='';});};
if(!cfg.v2){var bgi=new Image();bgi.src=BASE+'graphics/'+KEY+'/bg-'+({'lot-expiry':2,'warehouse-ops':4,'barcode-scan':4,'threepl-fulfillment':4}[KEY]||1)+'.jpg';}
log('loading graphic');document.head.appendChild(s);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
