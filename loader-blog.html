<script>
(function(){
var BASE='https://cdn.jsdelivr.net/gh/hey-sutton/marketing-site-graphics@v1.12.0/';
/* One entry per post: which graphic folder to load, an optional card shape (ar), an optional emphasis (lot-trace: supplier, genealogy or batch; barcode-scan: warehouse or manufacturing), and all:true when a post carries duplicate HowdyGo embeds that must all be hidden. */
var MAP={
'traceability-in-food-industry':{key:'blog-food-traceability',ar:'604/660'},
'food-recall-management':{key:'blog-food-traceability',ar:'604/660'},
'best-food-traceability-software':{key:'blog-food-traceability',ar:'604/660'},
'food-supply-chain':{key:'lot-trace',em:'supplier'},
'food-processing':{key:'lot-trace',em:'genealogy'},
'batch-manufacturing':{key:'lot-trace',em:'batch'},
'shelf-life-management':{key:'lot-expiry'},
'fefo':{key:'lot-expiry'},
'best-warehouse-management-software':{key:'warehouse-ops',ar:'604/650'},
'warehouse-management-process':{key:'warehouse-ops',ar:'604/650'},
'pick-pack-ship':{key:'warehouse-ops',ar:'604/650'},
'warehouse-barcode-system':{key:'barcode-scan',ar:'604/650',em:'warehouse',all:true},
'manufacturing-barcode-system':{key:'barcode-scan',ar:'604/650',em:'manufacturing'}
};
/* Posts with no graphic yet whose HowdyGo embed is broken: take the embed off the page. The article text is not touched. */
var REMOVE=['3pl-warehouse-management-system','food-processing-and-manufacturing','standardized-recipe','quickbooks-online-bill-of-materials','contract-manufacturing','multi-level-boms','food-production-line'];
/* Banner copy per graphic: the screen name used in the footer strip. */
var FRAME={'blog-food-traceability':'Food traceability','lot-trace':'Lot trace','lot-expiry':'Lot expiry','warehouse-ops':'Warehouse operations','barcode-scan':'Barcode scanning'};
var DEMO_URL='https://heysutton.com/book-a-demo';
var STUDIO_URL='https://heysutton.com/studio';
var DBG=/[?&]sxgdebug/.test(location.search);
function log(t){if(DBG&&window.console)console.log('[sxg-blog] '+t);}
var m=location.pathname.match(/\/blog\/([^\/?#]+)/);
var slug=m?m[1].toLowerCase():'';
if(REMOVE.indexOf(slug)>=0){
var drop=function(){[].forEach.call(document.querySelectorAll('.w-richtext #howdygo-embed'),function(e){var t=e.closest('.w-embed,[data-rt-embed-type]')||e;if(t.parentNode){log('removing howdygo embed');t.parentNode.removeChild(t);}});};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',drop);else drop();
return;}
var cfg=MAP[slug];
if(!cfg)return;
var KEY=cfg.key;
function find(){
/* The graphic replaces the HowdyGo embed that sits under the "with Sutton" heading. */
var embs=[].slice.call(document.querySelectorAll('.w-richtext #howdygo-embed'));
if(!embs.length){var one=document.querySelector('.w-richtext [id^="howdygo"]');if(one)embs=[one];}
if(embs.length){var hide=[];embs.forEach(function(e){var t=e.closest('.w-embed,[data-rt-embed-type]')||e;if(hide.indexOf(t)<0)hide.push(t);});if(!cfg.all)hide=hide.slice(0,1);log('replacing '+hide.length+' howdygo embed(s)');return{ref:hide[0],hide:hide};}
var hs=document.querySelectorAll('.w-richtext h2,.w-richtext h3');
for(var i=0;i<hs.length;i++){if(/with sutton\s*$|^\s*1\.\s*sutton/i.test(hs[i].textContent)){log('no howdygo embed, placing after heading');return{ref:hs[i].nextSibling,hide:[],parent:hs[i].parentNode};}}
return null;}
/* The Sutton frame: a green bar on top, the demo stage, a slim gray strip below. It is built inside its own shadow root so the site's article styles cannot change it. */
var FCSS=':host{all:initial}*{box-sizing:border-box}'
+'.fr{display:block;border:1px solid #103d35;background:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.4;color:#16171b}'
+'.top{background:#103d35;color:#fff;min-height:56px;padding:10px 16px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}'
+'.l{display:flex;align-items:center;min-width:0}'
+'.logo{display:block;width:86px;height:18px;max-width:none;filter:brightness(0) invert(1)}'
+'.dv{flex:none;width:1px;height:20px;margin:0 14px;background:rgba(255,255,255,.3)}'
+'.tl{font-size:13px;font-weight:600;color:#fff;white-space:nowrap}'
+'.r{flex:none;display:flex;align-items:center;gap:18px}'
+'.live{font-size:13px;color:rgba(255,255,255,.9);white-space:nowrap}'
+'.btn{display:inline-flex;align-items:center;height:36px;padding:0 16px;background:#ef7029;color:#16171b;font-family:inherit;font-size:13px;font-weight:600;line-height:1;text-decoration:none;white-space:nowrap}'
+'.btn:hover{background:#f38848}'
+'.btn:focus-visible,.st:focus-visible{outline:2px solid #ef7029;outline-offset:2px}'
+'.stage{position:relative;width:100%;overflow:hidden}'
+'.bot{background:#f2f2ef;min-height:44px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}'
+'.n{display:flex;align-items:center;gap:10px;font-size:13px;color:#3f3f46}'
+'.sq{flex:none;width:10px;height:10px;background:#ef7029}'
+'.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#16171b;text-decoration:none}'
+'.st:hover{text-decoration:underline}'
+'@media (max-width:560px){.dv,.tl,.live{display:none}.top{padding:10px 14px}.bot{padding:10px 14px}}';
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
var WAND='<svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 17L12 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 1.5L16.2 3.8L18.5 5L16.2 6.2L15 8.5L13.8 6.2L11.5 5L13.8 3.8Z" fill="currentColor"/><path d="M17 10.2L17.6 11.4L18.8 12L17.6 12.6L17 13.8L16.4 12.6L15.2 12L16.4 11.4Z" fill="currentColor"/></svg>';
function frame(cfg,stage){
var scr=FRAME[cfg.key]||'This screen';
var host=document.createElement('div');host.setAttribute('data-sxg-frame','1');
host.style.cssText='display:block;max-width:720px;margin:1.5rem auto;';
if(!host.attachShadow){return stage;}
var root=host.attachShadow({mode:'open'});
var st=document.createElement('style');st.textContent=FCSS;root.appendChild(st);
var wrap=el('div','fr');wrap.setAttribute('role','group');wrap.setAttribute('aria-label','Sutton demo: '+scr.toLowerCase());
var top=el('div','top');var l=el('div','l');
var logo=document.createElement('img');logo.className='logo';logo.alt='Sutton';logo.width=86;logo.height=18;logo.src=BASE+'assets/sutton-logo-color.png';logo.onerror=function(){logo.style.display='none';log('logo failed to load');};
l.appendChild(logo);l.appendChild(el('span','dv'));l.appendChild(el('span','tl','The AI-native ERP'));
var r=el('div','r');r.appendChild(el('span','live','Live product demo'));
var bk=el('a','btn','Book a demo \u2192');bk.href=DEMO_URL;r.appendChild(bk);
top.appendChild(l);top.appendChild(r);
var bot=el('div','bot');var n=el('div','n');n.appendChild(el('span','sq'));n.appendChild(el('span',null,scr+', a screen in Sutton. Illustrative data.'));
var sl=el('a','st');sl.href=STUDIO_URL;sl.innerHTML=WAND;sl.appendChild(document.createTextNode('Customize it with Studio'));
bot.appendChild(n);bot.appendChild(sl);
stage.classList.add('stage');
wrap.appendChild(top);wrap.appendChild(stage);wrap.appendChild(bot);root.appendChild(wrap);
return host;}
function go(){
if(document.querySelector('[data-sxg-frame]'))return;
var f=find();
if(!f){log('no target found');return;}
var box=document.createElement('div');
box.setAttribute('data-sxg-blog','1');
if(cfg.em)box.setAttribute('data-sx-emphasis',cfg.em);
box.style.aspectRatio=cfg.ar||'604/580';
var fr=frame(cfg,box);
f.hide.forEach(function(e){e.style.display='none';});
(f.parent||f.ref.parentNode).insertBefore(fr,f.ref);
log('mounted frame, stage '+box.offsetWidth+'x'+box.offsetHeight);
var s=document.createElement('script');
s.src=BASE+'graphics/'+KEY+'/card-1.js';
s.async=true;
s.sxCard=box;
s.onload=function(){var h=box.querySelector('[data-sxg-host]');if(h&&h.shadowRoot){var q=document.createElement('style');q.textContent='.studio{display:none!important}';h.shadowRoot.appendChild(q);}};
s.onerror=function(){log('graphic failed to load');fr.remove();f.hide.forEach(function(e){e.style.display='';});};
function start(){log('loading graphic');document.head.appendChild(s);}
if('IntersectionObserver' in window){
var io=new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting;})){io.disconnect();start();}},{rootMargin:'1200px 0px'});
io.observe(box);
}else start();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
