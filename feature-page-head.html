<!-- Product demo graphics: reserve the demo size before first paint so the capabilities section does not jump when the demos load. Paste into the feature page's Page settings, Inside <head> tag. -->
<style>
.section_capabilities .capabilities_card-visual{flex:none;aspect-ratio:604/540}
.section_capabilities .capabilities_card-visual .capabilities_visual-bg{position:absolute;top:0;left:0;width:100%;height:100%;max-height:none}
@media (min-width:1280px){.section_capabilities .capabilities_card-visual,.section_capabilities .capabilities_card-visual[data-sxg]{flex:1 1 0%;aspect-ratio:auto}}
/* Hero walkthrough: keep its 693 by 640 shape at every width and give it the same 1px stroke as the capability cards. The text column narrows first; only below 768px does the text drop under the walkthrough. */
.section_feature-hero .feature-hero_layout{column-gap:3rem}
.section_feature-hero .feature-hero_content{flex:1 1 20rem;min-width:20rem}
.section_feature-hero .feature-hero_visual{flex:0 1 693px;aspect-ratio:693/640;min-height:0;border:1px solid var(--light--stroke,#e2e3e6)}
@media (max-width:991px){
.section_feature-hero .feature-hero_layout{flex-direction:row;align-items:center}
.section_feature-hero .feature-hero_content{max-width:507px;align-items:flex-start}
.section_feature-hero .feature-hero_subtext{text-align:left}
.section_feature-hero .feature-hero_actions{width:auto;flex-direction:row;flex-wrap:wrap}
.section_feature-hero .feature-hero_visual{width:auto;max-width:693px}
}
@media (max-width:767px){
.section_feature-hero .feature-hero_layout{flex-direction:column;align-items:stretch}
.section_feature-hero .feature-hero_visual{order:-1;flex:none;width:100%;max-width:none}
.section_feature-hero .feature-hero_content{flex:none;min-width:0;max-width:none;align-items:center}
.section_feature-hero .feature-hero_subtext{text-align:center}
.section_feature-hero .feature-hero_actions{width:100%;flex-direction:column;flex-wrap:nowrap}
}
</style>
